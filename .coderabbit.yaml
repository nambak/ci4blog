# CodeRabbit 리뷰 설정
#
# 이 저장소는 PR 을 열어도 자동 리뷰가 돌지 않고 "Reviews should be triggered manually
# for repositories with fewer than 10 stars" 라며 건너뛴다(별 0개). 그래서 매번
# `@coderabbitai review` 를 손으로 넣어 왔다 — 자동 생성된 PR 에서 특히 번거롭다.
#
# ⚠️ 실측 결과(PR #161): **설정으로는 풀리지 않는다.** 이 파일을 넣고 PR 을 열었더니
# CodeRabbit 이 그대로 안내했다 —
#   "This repository does not receive automatic reviews because it has fewer than 10 stars."
# 저장소 수준 정책이라 auto_review.enabled 보다 우선한다. 그래서 트리거는
# .github/workflows/coderabbit-trigger.yml 이 대신 넣는다.
#
# 아래 auto_review 블록은 그래도 남겨 둔다 — 별이 10개를 넘으면 그때부터 의미가 생기고,
# base_branches·drafts 는 그때 바로 적용된다.

language: "ko-KR"

reviews:
  # chill: 사소한 취향 지적은 줄이고 실제 문제에 집중한다.
  # 지금까지 받은 리뷰가 이 프로파일이었고(로그의 "Review profile: CHILL"),
  # 접근성·위양성 같은 실질적인 지적을 내줬으므로 그대로 유지한다.
  profile: "chill"

  auto_review:
    enabled: true
    # main 으로 들어오는 PR 만 본다. 이 저장소는 main 단일 브랜치로 운영한다.
    base_branches:
      - "main"
    # 초안은 아직 볼 단계가 아니다.
    drafts: false

# CodeRabbit 리뷰 설정
#
# 이 저장소는 PR 을 열어도 자동 리뷰가 돌지 않고 "Reviews should be triggered manually
# for repositories with fewer than 10 stars" 라며 건너뛴다(별 0개). 그래서 매번
# `@coderabbitai review` 를 손으로 넣어 왔다 — 자동 생성된 PR 에서 특히 번거롭다.
#
# ⚠️ 실측 두 가지(PR #161·#162). 자동 리뷰를 켜려는 시도는 둘 다 막혔다.
#
# ① 설정으로는 안 된다. 이 파일을 넣고 PR 을 열었더니 그대로 안내했다 —
#    "This repository does not receive automatic reviews because it has fewer than 10 stars."
#    저장소 수준 정책이라 auto_review.enabled 보다 우선한다.
#
# ② 워크플로가 대신 `@coderabbitai review` 를 넣는 방법도 안 된다. **CodeRabbit 은 봇
#    코멘트를 트리거로 받아들이지 않는다.** 같은 PR·같은 문구·rate limit 없는 상태에서
#    작성자만 바꿔 대조했다 — github-actions[bot] 은 10분간 무반응, 사람 계정은 즉시 반응.
#    봇을 허용하는 설정도 없다(ignore_usernames 는 제외 전용). PAT 을 쓰면 되지만 토큰
#    관리 부담이 생겨 택하지 않았고, 트리거 워크플로는 지웠다.
#
# → 리뷰는 필요할 때 `@coderabbitai review` 를 **사람이** 직접 넣는다.
#
# 아래 auto_review 블록은 그래도 남겨 둔다 — 별이 10개를 넘으면 그때부터 의미가 생기고,
# base_branches·drafts 가 바로 적용된다. language·profile 은 지금도 적용된다.

language: "ko-KR"

reviews:
  # chill: 사소한 취향 지적은 줄이고 실제 문제에 집중한다.
  # 지금까지 받은 리뷰가 이 프로파일이었고(로그의 "Review profile: CHILL"),
  # 접근성·위양성 같은 실질적인 지적을 내줬으므로 그대로 유지한다.
  profile: "chill"

  auto_review:
    enabled: true
    # main 으로 들어오는 PR 만 본다. 이 저장소는 main 단일 브랜치로 운영한다.
    base_branches:
      - "main"
    # 초안은 아직 볼 단계가 아니다.
    drafts: false

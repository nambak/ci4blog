name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 배포가 겹치지 않게 한다(취소하지 않고 직렬화).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, sqlite3, curl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        # CI 러너엔 커버리지 드라이버(Xdebug/pcov)가 없다. phpunit.dist.xml 은
        # failOnWarning=true + <coverage> 설정이라, 드라이버 부재 경고가 실패로
        # 승격된다. 커버리지를 끄고 테스트 게이트로만 사용한다.
        run: composer test -- --no-coverage

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      # smoke.sh 를 러너로 가져온다. 이 잡은 원래 체크아웃하지 않았다.
      # 이후 git 작업이 없으므로 자격증명을 .git/config 에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/ci4blog
            ./scripts/deploy.sh

      # SSH 성공은 "스크립트가 끝났다"는 뜻일 뿐이다. 앱이 실제로 응답하는지는
      # 공인 도메인으로 직접 확인한다(DNS·TLS·Nginx·PHP 전체 경로).
      - name: Smoke test
        run: ./scripts/smoke.sh https://blog.unwanted.me

      # 실패 원인을 보려고 서버에 들어가지 않아도 되게 한다.
      # SSH 배포 자체가 실패했을 때도 돈다.
      - name: Collect diagnostics
        if: failure()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "===== 최근 애플리케이션 로그 ====="
            ls -t /var/www/ci4blog/writable/logs/*.log 2>/dev/null | head -1 | xargs -r tail -50
            echo "===== php-fpm 상태 ====="
            systemctl status php8.3-fpm --no-pager | head -20

name: CI/CD

on:
  push:
    branches: [main]
  # PR 에도 테스트를 돌린다. 이게 없으면 머지하기 전까지 그 브랜치가 테스트를
  # 통과하는지 알 수 없다 — 자동으로 열리는 PR 이 생기면서 특히 중요해졌다.
  pull_request:
    branches: [main]
  workflow_dispatch:

# 동시에 두 배포가 겹치지 않게 한다(취소하지 않고 직렬화).
# PR 검증까지 같은 그룹에 넣으면 배포 대기열에 끼어들어 서로를 막으므로 PR 은 따로 묶는다.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.event.pull_request.number)
        || 'deploy-production' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, sqlite3, curl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        # CI 러너엔 커버리지 드라이버(Xdebug/pcov)가 없다. phpunit.dist.xml 은
        # failOnWarning=true + <coverage> 설정이라, 드라이버 부재 경고가 실패로
        # 승격된다. 커버리지를 끄고 테스트 게이트로만 사용한다.
        run: composer test -- --no-coverage

  # 커버리지는 배포를 막지 않는다 — deploy 의 needs 에 넣지 않아 test 와 병렬로
  # 돌고, 여기서 실패해도 배포는 그대로 나간다. (#115)
  coverage:
    name: Coverage
    # PR 에서는 테스트 게이트만 돌린다. 커버리지 리포트는 main 기준으로만 낸다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 이 job 은 저장소를 읽고, 테스트를 돌리고, 요약과 아티팩트를 남기는 것이
    # 전부다 — 쓰기 권한이 필요 없다. job 레벨로만 좁힌다(워크플로 레벨에 두면
    # deploy job 까지 함께 묶인다). 아티팩트 업로드는 GITHUB_TOKEN 이 아니라
    # 러너의 Artifact 서비스를 쓰므로 contents: read 로 충분하다.
    permissions:
      contents: read
    # concurrency(deploy-production, cancel-in-progress: false)와 겹치면 이 job이
    # 걸려 있는 동안 다음 push의 배포가 그만큼 대기열에 갇힌다. 기본 360분 대신
    # 상한을 둔다.
    timeout-minutes: 20
    steps:
      # 이후 git 작업이 없으므로 자격증명을 .git/config 에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, sqlite3, curl, gd
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # phpunit.dist.xml 이 이미 clover·html 리포트를 내도록 설정돼 있다.
      # test 잡과 달리 커버리지를 끄지 않는 것이 전부다.
      - name: Run tests with coverage
        run: composer test

      # PHPUnit 은 테스트가 실패해도 clover/html 리포트를 쓴다. 실패한 순간이야말로
      # 리포트가 가장 보고 싶을 때이므로, 앞 스텝이 실패해도 건너뛰지 않는다.
      - name: Write coverage summary
        if: always()
        run: php scripts/coverage-summary.php build/logs/clover.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/logs/html
          retention-days: 14

  deploy:
    name: Deploy
    # PR 은 검증까지다. 배포는 main 에 들어온 뒤에만 한다.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      # smoke.sh 를 러너로 가져온다. 이 잡은 원래 체크아웃하지 않았다.
      # 이후 git 작업이 없으므로 자격증명을 .git/config 에 남기지 않는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/ci4blog
            ./scripts/deploy.sh

      # SSH 성공은 "스크립트가 끝났다"는 뜻일 뿐이다. 앱이 실제로 응답하는지는
      # 공인 도메인으로 직접 확인한다(DNS·TLS·Nginx·PHP 전체 경로).
      - name: Smoke test
        run: ./scripts/smoke.sh https://blog.unwanted.me

      # 실패 원인을 보려고 서버에 들어가지 않아도 되게 한다.
      # SSH 배포 자체가 실패했을 때도 돈다.
      - name: Collect diagnostics
        if: failure()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "===== 최근 애플리케이션 로그 ====="
            ls -t /var/www/ci4blog/writable/logs/*.log 2>/dev/null | head -1 | xargs -r tail -50
            echo "===== php-fpm 상태 ====="
            systemctl status php8.3-fpm --no-pager | head -20

name: 버그 리포트
description: 동작이 기대와 다를 때
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 이슈에 `claude-go` 라벨을 붙이면 **Claude Code 가 이 내용만 읽고** 코드를
        고쳐 PR 을 엽니다. 아래 항목이 비어 있으면 엉뚱한 원인을 짚습니다 — 실제로 그런 일이
        한 번 있었습니다(#152: 본문이 비어 있어 리눅스에서 재현되지 않는 macOS 버그로 진단).

  - type: dropdown
    id: environment
    attributes:
      label: 어디서 겪었나요
      description: 같은 증상이라도 환경에 따라 원인이 전혀 다릅니다.
      options:
        - 운영 (blog.unwanted.me)
        - 로컬 (ci4blog.test)
        - 둘 다
        - 모르겠음
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 그대로 따라 하면 재현되도록 적어 주세요.
      placeholder: |
        1. 관리자 게시글 관리(/admin/posts) 로 들어간다
        2. 한글 제목 글의 "수정" 을 누른다
        3. 제목만 고치고 저장한다
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 기대한 동작과 실제 동작
      placeholder: |
        기대: 수정한 글의 상세 페이지로 이동한다
        실제: 404 페이지가 뜬다
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 오류 메시지·로그·URL
      description: 있으면 붙여 주세요. 없으면 비워도 됩니다.
      placeholder: |
        - 주소: https://blog.unwanted.me/posts/...
        - writable/logs/log-2026-08-20.log 의 마지막 20줄
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 범위
      options:
        - label: 이 이슈는 한 가지 문제만 다룬다 (여러 개면 이슈를 나눠 주세요)
          required: true
